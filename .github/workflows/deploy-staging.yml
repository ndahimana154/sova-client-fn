name: Deploy Sova Client Staging

on:
    push:
        branches:
            - staging

    workflow_dispatch:

concurrency:
    group: sova-client-staging-deployment
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy Client
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Configure SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
                  SERVER_HOST: ${{ secrets.SERVER_HOST }}
                  SERVER_PORT: ${{ secrets.SERVER_PORT }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/sova_client
                  chmod 600 ~/.ssh/sova_client

                  PORT="${SERVER_PORT:-22}"

                  ssh-keyscan -p "$PORT" -H "$SERVER_HOST" \
                    >> ~/.ssh/known_hosts

                  chmod 600 ~/.ssh/known_hosts

            - name: Deploy Client
              env:
                  SERVER_HOST: ${{ secrets.SERVER_HOST }}
                  SERVER_USER: ${{ secrets.SERVER_USER }}
                  SERVER_PORT: ${{ secrets.SERVER_PORT }}
              run: |
                  PORT="${SERVER_PORT:-22}"

                  ssh \
                    -i ~/.ssh/sova_client \
                    -p "$PORT" \
                    -o BatchMode=yes \
                    -o StrictHostKeyChecking=yes \
                    "$SERVER_USER@$SERVER_HOST" \
                    "bash /var/www/sova/scripts/deploy-client.sh"
